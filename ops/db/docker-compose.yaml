version: "2"
services:
  poc-postgresql-mach-system:
    hostname: localhost
    image: docker.io/bitnami/postgresql:latest
    ports:
      - "5432:5432"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_USERNAME=postgres
    volumes:
      - "poc_postgresql_mach_system_data:/bitnami/postgresql"
  poc-pgAdmin-mach-system:
    image: dpage/pgadmin4
    depends_on:
      - poc-postgresql-mach-system
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.de
      - PGADMIN_DEFAULT_PASSWORD=admin
volumes:
  poc_postgresql_mach_system_data:
    driver: local
